target-version = "py310"
line-length = 88

[lint]
# Start from ruff's default rule set and add a few high-signal families.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "SIM105", # try/except/pass is clearer than contextlib.suppress here
    "B905",   # explicit zip(strict=) not required for these fixed-length pairs
    "RUF001", # fullwidth punctuation is intentional in the Chinese docs
    "RUF002", # same as RUF001 but inside docstrings
    "RUF003", # same as RUF001 but inside comments
]

[lint.per-file-ignores]
"tests/*" = [
    "RUF059", # intentionally unused unpacked placeholders
    "B017",   # broad exception assertions are the point of the regression tests
    "SIM300", # Yoda conditions read naturally in the assertions
]

[lint.isort]
known-first-party = ["mim", "dataset", "train", "inference", "metrics", "visualization"]
