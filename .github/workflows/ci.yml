name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (supply-chain hardening); bump via
      # Dependabot/Renovate rather than mutable major-version tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # Force the CPU-only build to avoid pulling large CUDA wheels.
          pip install --force-reinstall torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests/ -v
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt -r requirements-dev.txt
